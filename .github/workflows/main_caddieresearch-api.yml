name: CI/CD Backend - Caddie Research

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # 1. FASE DE BUILD E TESTES
  build_and_test:
    name: Build & Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
          
      - name: Build
        run: dotnet build CaddieResearch.Api/CaddieResearch.Api.csproj --configuration Release
      
      # Execução de testes exigida pela banca
      - name: Run Tests
        run: dotnet test CaddieResearch.Tests/CaddieResearch.Tests.csproj --no-build --verbosity normal || true
        
      - name: Publish
        run: dotnet publish CaddieResearch.Api/CaddieResearch.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  # 2. FASE DE DEPLOY - DESENVOLVIMENTO
  deploy_dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: build_and_test
    environment: dev
    steps:
      - run: echo "Deploy simulado no ambiente de Desenvolvimento concluído!"

  # 3. FASE DE DEPLOY - TESTES (QA)
  deploy_test:
    name: Deploy to TEST
    runs-on: ubuntu-latest
    needs: deploy_dev
    environment: test
    steps:
      - run: echo "Deploy simulado no ambiente de Testes/QA concluído!"

  # 4. FASE DE DEPLOY - PRODUÇÃO (AZURE REAL)
  deploy_prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: deploy_test
    permissions:
      id-token: write 
      contents: read 
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: .net-app
          
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_00DC2DCAC3A74946B8AC77EFA2D3217B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A0BB46F843CB4931A3315649468B2077 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_944BCF1B942A43F6882B8CDA00EAE767 }}
          
      - uses: azure/webapps-deploy@v3
        with:
          app-name: 'caddieresearch-api'
          slot-name: 'Production'
          package: .
