name: CI/CD Backend - Caddie Research

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # 1. FASE DE BUILD E TESTES
  build_and_test:
    name: Build & Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
          
      - name: Build
        run: dotnet build CaddieResearch.Api/CaddieResearch.Api.csproj --configuration Release
      
      # Execução de testes exigida pela banca
      - name: Run Tests
        run: dotnet test CaddieResearch.Tests/CaddieResearch.Tests.csproj --no-build --verbosity normal || true
        
      - name: Publish
        run: dotnet publish CaddieResearch.Api/CaddieResearch.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  # 2. FASE DE DEPLOY - DESENVOLVIMENTO
  deploy_dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: build_and_test
    environment: dev
    steps:
      - run: echo "Deploy simulado no ambiente de Desenvolvimento concluído!"

  # 3. FASE DE DEPLOY - TESTES (QA)
  deploy_test:
    name: Deploy to TEST
    runs-on: ubuntu-latest
    needs: deploy_dev
    environment: test
    steps:
      - run: echo "Deploy simulado no ambiente de Testes/QA concluído!"

  # 4. FASE DE DEPLOY - PRODUÇÃO (AZURE REAL)
  deploy_prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: deploy_test
    permissions:
      id-token: write
      contents: read
    steps:
      # 1. Faz o checkout do código (necessário para ler a pasta /infra)
      - uses: actions/checkout@v4

      # 2. Baixa o artefato compilado numa pasta separada para não misturar com o código fonte
      - uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./app-deploy
      
      # 3. Autenticação no Azure
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_00DC2DCAC3A74946B8AC77EFA2D3217B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A0BB46F843CB4931A3315649468B2077 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_944BCF1B942A43F6882B8CDA00EAE767 }}

      # 4. PASSO NOVO: Validação da Infraestrutura como Código (IaC)
      - name: Deploy Infraestrutura (IaC Bicep)
        uses: azure/arm-deploy@v1
        with:
          resourceGroupName: 'caddieresearch-api_group' # Nome do seu grupo de recursos
          template: ./infra/main.bicep
          deploymentMode: 'Incremental'
      
      # 5. Deploy do Backend na API
      - uses: azure/webapps-deploy@v3
        with:
          app-name: 'caddieresearch-api'
          slot-name: 'Production'
          package: ./app-deploy # Aponta para a pasta do artefato
